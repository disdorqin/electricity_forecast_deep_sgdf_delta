# DeepSGDFDelta / TrendKnight - Test CI
# Runs unit tests, import smoke checks, and script --help validation.

name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ── Core test suite ──────────────────────────────────────────────
      - name: Run pytest
        run: python -m pytest tests/ -v

      # ── Script --help smoke tests ────────────────────────────────────
      # These verify that each entry-point script can at least parse its
      # arguments without crashing.  SGDFNet is NOT available in CI, so
      # scripts that depend on it will import but exit early via --help.
      - name: "Script smoke: check_sgdfnet_bridge.py --help"
        run: python scripts/check_sgdfnet_bridge.py --help

      - name: "Script smoke: train_phase2_trendknight.py --help"
        run: python scripts/train_phase2_trendknight.py --help

      - name: "Script smoke: evaluate_phase2_trendknight.py --help"
        run: python scripts/evaluate_phase2_trendknight.py --help

      - name: "Script smoke: run_phase2_monthly_backtest.py --help"
        run: python scripts/run_phase2_monthly_backtest.py --help

      - name: "Script smoke: search_phase2_champion.py --help"
        run: python scripts/search_phase2_champion.py --help
